# Supabase Postgres connection

# Updated Supabase Postgres connection - using transaction mode for higher connection limits
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=


# HikariCP connection pool configuration for Supabase transaction mode
# Optimized for prepared statement conflict resolution
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.prepare-threshold=0
spring.datasource.hikari.cache-prep-stmts=false
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.isolation-level=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.validation-timeout=5000

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.isolation=2

spring.application.name=ai-assistant-backend

# AI Configuration
# Replicate API Key (for OpenAI, Mistral, Anthropic, etc.)
replicate.api.key=

# Gemini API Key (get from https://makersuite.google.com/app/apikey)
gemini.api.key=
# SSLCommerz Configuration
sslcommerz.store.id=
sslcommerz.store.password=
sslcommerz.sandbox=true

# Frontend URL for redirects
frontend.url=http://localhost:3000
backend.url=http://localhost:8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Vector Database Configuration
vector.embedding.dimension=1536
vector.similarity.threshold=0.7
vector.chunk.size=1000
vector.chunk.overlap=200
vector.batch.size=100

# OpenAI Configuration for Embeddings
openai.api.key=
openai.embedding.model=text-embedding-ada-002
openai.api.timeout=30000
openai.max.retries=3

# Caching Configuration
spring.cache.type=simple
spring.cache.cache-names=embeddings,similaritySearch,ragContext

# Performance Configuration
app.vector.processing.thread-pool-size=5
app.vector.embedding.batch-processing=true
app.vector.enable-async-processing=true

