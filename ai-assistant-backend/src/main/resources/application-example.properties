# Supabase Postgres connection

# Updated Supabase Postgres connection
spring.datasource.url=jdbc:postgresql://your-supabase-url:5432/postgres
spring.datasource.username=your-supabase-username
spring.datasource.password=YOUR_SUPABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.application.name=ai-assistant-backend

# AI Configuration
# Replicate API Key (for OpenAI, Mistral, Anthropic, etc.)
replicate.api.key=YOUR_REPLICATE_API_KEY

# Gemini API Key (get from https://makersuite.google.com/app/apikey)
gemini.api.key=YOUR_GEMINI_API_KEY

# SSLCommerz Configuration
sslcommerz.store.id=YOUR_SSLCOMMERZ_STORE_ID
sslcommerz.store.password=YOUR_SSLCOMMERZ_PASSWORD
sslcommerz.sandbox=true

# Frontend URL for redirects
frontend.url=http://localhost:3000
backend.url=http://localhost:8080
